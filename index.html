<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxel Sandbox Engine</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div class="title">Voxel Sandbox Engine</div>
      <div class="row">WASD move | Space jump | Shift sprint | Mouse look</div>
      <div class="row">Left click break | Right click place | F throw physics core</div>
      <div class="row">1-5 select block | F3 debug | F4 potato | Esc pause</div>
    </div>
    <div id="debug-panel"></div>
    <canvas id="minimap" width="128" height="128"></canvas>
    <div id="pause-menu">
      <div class="menu-panel">
        <div class="menu-title">Voxel Sandbox Engine</div>
        <div class="world-panel">
          <label class="menu-label" for="world-select">Saved World</label>
          <div class="world-row">
            <select id="world-select" class="world-select"></select>
            <button id="new-world-button" class="icon-button" type="button" aria-label="Create world">
              +
            </button>
          </div>
        </div>
        <div class="menu-actions">
          <button id="resume-button" class="menu-button" type="button">Resume</button>
          <button
            id="potato-button"
            class="menu-button secondary"
            type="button"
            aria-pressed="false"
          >
            Potato Mode: Off
          </button>
        </div>
      </div>
    </div>
    <div id="crosshair"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
