<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxel Sandbox Engine</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div class="title">Voxel Sandbox Engine</div>
      <div class="row">WASD move | Space jump | Shift sprint | Mouse look</div>
      <div class="row">Left click break | Right click place | F throw physics core</div>
      <div class="row">1-5 select block | F3 debug | F4 quality | Esc pause</div>
    </div>
    <div id="debug-panel"></div>
    <canvas id="minimap" width="128" height="128"></canvas>
    <div id="home-screen">
      <div class="home-shell">
        <div class="home-brand">
          <div class="home-title">Voxel Sandbox Engine</div>
          <div class="home-subtitle">Local worlds</div>
        </div>
        <div class="home-grid">
          <section class="menu-panel">
            <div class="menu-title">Create World</div>
            <form id="create-world-form" class="world-form">
              <label class="menu-label" for="world-name-input">Name</label>
              <input
                id="world-name-input"
                class="text-input"
                name="worldName"
                type="text"
                maxlength="48"
                autocomplete="off"
                placeholder="New World"
              />
              <label class="menu-label" for="world-seed-input">Seed</label>
              <div class="seed-row">
                <input
                  id="world-seed-input"
                  class="text-input"
                  name="worldSeed"
                  type="text"
                  maxlength="64"
                  autocomplete="off"
                  placeholder="random"
                />
                <button id="random-seed-button" class="menu-button secondary" type="button">
                  Random
                </button>
              </div>
              <button class="menu-button" type="submit">Create</button>
            </form>
          </section>
          <section class="menu-panel">
            <div class="menu-title">Load World</div>
            <div id="home-world-list" class="world-list" aria-label="Saved worlds"></div>
          </section>
        </div>
      </div>
    </div>
    <div id="pause-menu" class="is-hidden">
      <div class="menu-panel">
        <div class="menu-title">Voxel Sandbox Engine</div>
        <div class="menu-actions">
          <button id="resume-button" class="menu-button" type="button">Resume</button>
          <button id="home-button" class="menu-button secondary" type="button">
            Exit to Home
          </button>
          <button
            id="quality-button"
            class="menu-button secondary"
            type="button"
          >
            Quality: Normal
          </button>
          <label
            id="super-ultra-toggle-row"
            class="danger-toggle"
            for="super-ultra-toggle"
            aria-hidden="true"
            hidden
          >
            <span class="danger-copy">
              <span class="danger-title">Allow Super Ultra Mode</span>
              <span id="super-ultra-warning" class="danger-warning">
                Unlocks the 12x distance preset. Might turn your computer into a toaster.
              </span>
            </span>
            <input
              id="super-ultra-toggle"
              class="toggle-input"
              type="checkbox"
              aria-describedby="super-ultra-warning"
            />
          </label>
        </div>
      </div>
    </div>
    <div id="crosshair"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
