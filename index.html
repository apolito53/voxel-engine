<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxel Sandbox Engine</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div class="title">Voxel Sandbox Engine</div>
      <div class="row">WASD move | Space jump | Shift sprint | Mouse look</div>
      <div class="row">Left click break | Right click place | F throw physics core</div>
      <div class="row">1-5 select block | Esc pause</div>
    </div>
    <div id="pause-menu">
      <div class="menu-panel">
        <div class="menu-title">Voxel Sandbox Engine</div>
        <button id="resume-button" type="button">Resume</button>
      </div>
    </div>
    <div id="crosshair"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
